spring.application.name=recall

# Database. The defaults match docker-compose.yml; override with environment variables elsewhere.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recall}
spring.datasource.username=${DATABASE_USER:recall}
spring.datasource.password=${DATABASE_PASSWORD:recall}

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Automatic sending is off during the tap-to-send pilot.
recall.worker.enabled=false
recall.worker.interval=PT5M
