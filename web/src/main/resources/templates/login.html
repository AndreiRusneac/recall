<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autentificare · Recall</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="narrow">
    <h1>Recall</h1>
    <p class="summary">Autentificați-vă pentru a vedea programările clinicii.</p>

    <p th:if="${param.error}" class="errors">Email sau parolă incorecte.</p>
    <p th:if="${param.logout}" class="result">Ați fost deconectat.</p>

    <form method="post" th:action="@{/login}" class="stacked">
        <label>Email <input type="email" name="username" autocomplete="username" required autofocus></label>
        <label>Parolă <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Intră în cont</button>
    </form>
</main>
</body>
</html>
