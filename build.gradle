plugins {
    // Declared here once so every module can use Spring Boot's dependency versions.
    id 'org.springframework.boot' version '4.1.1' apply false
}

subprojects {
    apply plugin: 'java-library'

    group = 'app.recall'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }

    dependencies {
        // Spring Boot's BOM pins the version of every library below, so modules never write version numbers.
        api platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
        // Keep parameter names in the compiled code. Spring needs them to bind @PathVariable and
        // @RequestParam by name. The Boot plugin only adds this to modules that apply it (just `app`).
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
